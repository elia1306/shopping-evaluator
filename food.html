<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>♥ 日本好好吃 ♥｜日系繪本美食雷達</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'jf-openhuninn';
      src: url('https://cdn.jsdelivr.net/gh/justfont/open-huninn-font@master/font/jf-openhuninn-2.1.woff2') format('woff2'),
           url('https://cdn.jsdelivr.net/gh/justfont/open-huninn-font@master/font/jf-openhuninn-2.0.woff2') format('woff2');
      font-display: swap;
    }
    body {
      font-family: 'jf-openhuninn', 'Noto Sans TC', system-ui, -apple-system, sans-serif;
      background-color: #FFFCF6;
      color: #3E3A39;
    }
    .ehon-box {
      border: 3px solid #3E3A39 !important;
      border-radius: 24px !important;
      box-shadow: 0 4px 0 #3E3A39;
    }
    .ehon-btn {
      border: 2.5px solid #3E3A39 !important;
      box-shadow: 0 2px 0 #3E3A39;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .ehon-btn:active {
      transform: translateY(2px);
      box-shadow: 0 0 0 #3E3A39;
    }
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @media (max-width: 639px) {
      input, select, textarea { font-size: 16px !important; }
    }
  </style>
</head>
<body class="min-h-screen antialiased selection:bg-[#F6D27A] selection:text-[#3E3A39]">

  <!-- Top Header -->
  <header class="sticky top-0 z-30 border-b-[3px] border-[#3E3A39] bg-[#FFFCF6]">
    <div class="mx-auto max-w-7xl px-3 py-2.5 sm:px-6 sm:py-4 lg:px-8">
      <div class="flex flex-col gap-2">
        <div class="flex items-center justify-between gap-2">
          <div class="flex min-w-0 items-center gap-2">
            <button type="button" onclick="window.location.reload()" title="重新整理頁面" aria-label="重新整理頁面" class="ehon-btn flex h-9 w-9 shrink-0 cursor-pointer items-center justify-center rounded-2xl bg-[#F6D27A] text-[#3E3A39] hover:brightness-95 sm:h-10 sm:w-10">
              <svg class="h-4 w-4 sm:h-5 sm:w-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 11h16a8 8 0 01-16 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 19h6M8 4v3m4-4v4m4-3v3" />
              </svg>
            </button>
            <h1 class="truncate text-lg font-bold tracking-tight text-[#3E3A39] sm:text-2xl">♥ 日本好好吃 ♥</h1>
          </div>

          <div class="header-actions flex shrink-0 items-center gap-1.5 sm:gap-2">
            <button id="btn-toggle-view-mode" type="button" title="切換檢視/編輯模式" aria-label="切換檢視/編輯模式" class="ehon-btn inline-flex h-9 items-center justify-center gap-1.5 rounded-2xl bg-[#FFFCF6] px-2.5 text-xs font-bold text-[#3E3A39] hover:bg-[#F6D27A]/40 sm:h-auto sm:px-3 sm:py-2 sm:text-sm">
              <span id="btn-view-mode-icon">👁️</span>
              <span id="btn-view-mode-label" class="hidden sm:inline">切換檢視模式</span>
            </button>
            <button id="btn-cloud-sync" type="button" title="雲端同步" aria-label="雲端同步" class="ehon-btn inline-flex h-9 items-center justify-center gap-1.5 rounded-2xl bg-[#A8D3E6] px-2.5 text-xs font-bold text-[#3E3A39] hover:brightness-95 sm:h-auto sm:px-3 sm:py-2 sm:text-sm">
              <span aria-hidden="true">☁️</span>
              <span id="btn-cloud-label" class="hidden sm:inline">雲端同步（本機）</span>
            </button>
            <button id="btn-add-spot" type="button" title="新增美食 / 貼上 JSON" aria-label="新增美食 / 貼上 JSON" class="ehon-btn inline-flex h-9 items-center justify-center gap-1 rounded-2xl bg-[#F2A497] px-2.5 text-sm font-bold text-[#3E3A39] hover:brightness-95 sm:h-auto sm:px-3.5 sm:py-2 sm:text-sm">
              <span aria-hidden="true">＋</span>
              <span class="hidden sm:inline">新增美食 / 貼上 JSON</span>
            </button>
          </div>
        </div>

        <div class="flex flex-wrap items-center justify-between gap-2">
          <div class="flex flex-wrap items-center gap-2">
            <nav aria-label="切換頁面" class="inline-flex flex-wrap rounded-2xl border-[2.5px] border-[#3E3A39] bg-[#FFFCF6] p-0.5 text-xs font-bold">
              <a href="./index.html" data-hide-in-share="true" class="whitespace-nowrap rounded-xl px-2.5 py-1 text-[#3E3A39] transition hover:bg-[#F2A497]/40 sm:px-3">推薦好物</a>
              <span class="whitespace-nowrap rounded-xl bg-[#F6D27A] px-2.5 py-1 text-[#3E3A39] sm:px-3">美食雷達</span>
              <a href="./trip.html" id="nav-trip-link" class="whitespace-nowrap rounded-xl px-2.5 py-1 text-[#3E3A39] transition hover:bg-[#B9DAA5]/40 sm:px-3">旅遊行程</a>
              <a href="./expenses.html" id="nav-expenses-link" class="whitespace-nowrap rounded-xl px-2.5 py-1 text-[#3E3A39] transition hover:bg-[#F2A497]/40 sm:px-3">旅遊記帳</a>
              <a href="./japanese.html" id="nav-japanese-link" class="whitespace-nowrap rounded-xl px-2.5 py-1 text-[#3E3A39] transition hover:bg-[#A8D3E6]/40 sm:px-3">日文手冊</a>
            </nav>
          </div>
          <p id="header-subtitle" class="hidden text-xs text-[#3E3A39]/75 sm:block sm:text-sm">地區分類 × 食物種類 × 推薦必點 × Google Maps</p>
        </div>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">

    <!-- Integrated Quick Filter & Location Bar -->
    <section aria-label="篩選與搜尋" class="ehon-box mb-4 space-y-2.5 bg-[#FFFCF6] p-3 sm:mb-6 sm:p-4">
      <!-- Row 1: Starred + All + Collapsible Location/Search Toggle -->
      <div class="flex items-center gap-1.5 sm:gap-2">
        <button id="btn-filter-star" type="button" class="ehon-btn inline-flex shrink-0 items-center gap-1.5 rounded-2xl bg-[#FFFCF6] px-3 py-1.5 text-left transition hover:bg-[#F6D27A]/45 sm:px-3.5 sm:py-2">
          <span class="text-xs font-bold text-[#3E3A39]">★ 想吃</span>
          <span id="stat-starred" class="text-sm font-bold leading-none text-[#3E3A39] sm:text-base">0</span>
        </button>
        <button id="btn-filter-all" type="button" class="ehon-btn inline-flex shrink-0 items-center gap-1.5 rounded-2xl bg-[#FFFCF6] px-3 py-1.5 text-left transition hover:bg-slate-50 sm:px-3.5 sm:py-2">
          <span class="text-xs font-bold text-[#3E3A39]/80">全部</span>
          <span id="stat-total" class="text-sm font-bold leading-none text-[#3E3A39] sm:text-base">0</span>
        </button>
        <div class="ml-auto flex shrink-0 items-center gap-1.5">
          <button id="btn-quick-reset" type="button" title="重設所有篩選" class="ehon-btn hidden inline-flex shrink-0 items-center gap-1 rounded-2xl bg-[#F2A497]/35 px-2.5 py-1.5 text-xs font-bold text-[#3E3A39] hover:bg-[#F2A497]/60 sm:px-3 sm:py-2">
            <span>↺</span>
            <span>重設</span>
          </button>
          <button id="btn-toggle-food-display-mode" type="button" title="切換圖片模式 / 詳細模式" aria-label="切換圖片模式 / 詳細模式" class="ehon-btn inline-flex shrink-0 items-center gap-1 rounded-2xl bg-[#FFFCF6] px-2.5 py-1.5 text-xs font-bold text-[#3E3A39] hover:bg-[#A8D3E6]/40 sm:px-3 sm:py-2">
            <span id="btn-food-display-icon">🖼️</span>
            <span id="btn-food-display-label" class="hidden sm:inline">圖片模式</span>
          </button>
          <button id="btn-toggle-food-advanced" type="button" aria-expanded="false" title="進階搜尋" aria-label="進階搜尋" class="ehon-btn inline-flex shrink-0 items-center gap-1 rounded-2xl bg-[#FFFCF6] px-2.5 py-1.5 text-xs font-bold text-[#3E3A39] hover:bg-[#A8D3E6]/40 sm:px-3 sm:py-2">
            <span>🔍</span>
            <span class="hidden sm:inline">搜尋</span>
            <span id="food-advanced-dot" class="hidden h-2 w-2 rounded-full bg-[#F2A497] ring-1 ring-[#3E3A39]"></span>
            <span id="food-advanced-arrow">▾</span>
          </button>
        </div>
      </div>

      <!-- Row 2: Switch between Type & Location Quick Filters -->
      <div class="flex flex-wrap items-center gap-2 border-t-2 border-dashed border-[#3E3A39]/10 pt-2">
        <div role="tablist" aria-label="切換篩選維度" class="inline-flex rounded-2xl border-2 border-[#3E3A39] bg-white p-0.5 text-xs font-bold">
          <button id="btn-mode-type" type="button" role="tab" aria-selected="true" class="rounded-xl bg-[#A8D3E6] px-2.5 py-1 text-[#3E3A39] transition">🍜 種類</button>
          <button id="btn-mode-location" type="button" role="tab" aria-selected="false" class="rounded-xl px-2.5 py-1 text-[#3E3A39]/75 transition hover:bg-[#F6D27A]/30">📍 地點</button>
        </div>
        <div id="active-filter-summary" class="flex flex-wrap items-center gap-1 text-[11px] font-bold text-[#3E3A39]/70"></div>
      </div>

      <!-- Row 3A: Horizontal Scrollable Food Type Pills -->
      <div id="food-type-pills" class="no-scrollbar flex w-full min-w-0 flex-nowrap items-center gap-1.5 overflow-x-auto px-0.5 py-1 sm:flex-wrap sm:overflow-visible sm:p-0"></div>

      <!-- Row 3B: Location Quick Pills (City -> Optional Area) -->
      <div id="food-location-pills-wrap" class="hidden space-y-2">
        <div id="food-city-pills" class="no-scrollbar flex w-full min-w-0 flex-nowrap items-center gap-1.5 overflow-x-auto px-0.5 py-1 sm:flex-wrap sm:overflow-visible sm:p-0"></div>
        <div id="food-area-pills" class="no-scrollbar hidden w-full min-w-0 flex-nowrap items-center gap-1.5 overflow-x-auto border-t-2 border-dashed border-[#3E3A39]/15 px-0.5 pb-1 pt-2 sm:flex-wrap sm:overflow-visible sm:pb-0"></div>
      </div>

      <!-- Collapsible Location Filters + Search + Visited/Review -->
      <div id="food-advanced-panel" class="hidden grid grid-cols-2 gap-2 border-t-2 border-dashed border-[#3E3A39]/15 pt-3 sm:grid-cols-3 lg:grid-cols-6">
        <select id="filter-region" aria-label="大地區" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-xs font-medium text-slate-700 outline-none focus:border-amber-500 focus:bg-white focus:ring-2 focus:ring-amber-100 sm:text-sm">
          <option value="全部">全部大地區</option>
        </select>
        <select id="filter-city" aria-label="城市" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-xs font-medium text-slate-700 outline-none focus:border-amber-500 focus:bg-white focus:ring-2 focus:ring-amber-100 sm:text-sm">
          <option value="全部">全部城市</option>
        </select>
        <select id="filter-area" aria-label="區域" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-xs font-medium text-slate-700 outline-none focus:border-amber-500 focus:bg-white focus:ring-2 focus:ring-amber-100 sm:text-sm">
          <option value="全部">全部區域</option>
        </select>
        <select id="filter-visited" aria-label="造訪狀態" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-xs font-medium text-slate-700 outline-none focus:border-amber-500 focus:bg-white focus:ring-2 focus:ring-amber-100 sm:text-sm">
          <option value="all">全部狀態</option>
          <option value="unvisited">未去過</option>
          <option value="visited">已吃過</option>
          <option value="review:很好">😋 很好</option>
          <option value="review:普通">😐 普通</option>
          <option value="review:踩雷">💣 踩雷</option>
        </select>
        <div class="col-span-2 flex gap-2">
          <div class="relative flex-1">
            <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
            <input id="input-search" type="search" enterkeyhint="search" placeholder="搜尋店名、推薦品項、備註..." class="w-full rounded-xl border border-slate-200 bg-slate-50 py-2 pl-9 pr-3 text-base text-slate-800 placeholder-slate-400 outline-none focus:border-amber-500 focus:bg-white focus:ring-2 focus:ring-amber-100 sm:text-sm" />
          </div>
          <button id="btn-reset-filters" type="button" class="shrink-0 rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-medium text-slate-600 transition hover:bg-slate-100">重設</button>
        </div>
      </div>
    </section>

    <!-- Table View (Desktop) + Card List (Mobile) + Image Grid -->
    <section aria-label="美食餐廳表格" class="ehon-box overflow-hidden bg-[#FFFCF6]">
      <div id="food-desktop-table-wrap" class="hidden overflow-x-auto md:block">
        <table class="min-w-full divide-y divide-slate-200 text-left text-sm">
          <thead class="bg-slate-50 text-xs font-semibold text-slate-600">
            <tr>
              <th scope="col" class="w-12 px-3 py-3.5 text-center">想吃</th>
              <th scope="col" class="w-24 px-3 py-3.5 text-center">縮圖</th>
              <th scope="col" class="min-w-[180px] px-4 py-3.5">店名</th>
              <th scope="col" class="min-w-[150px] px-4 py-3.5">地點（地區 / 城市 / 區域）</th>
              <th scope="col" class="w-28 px-4 py-3.5">種類</th>
              <th scope="col" class="min-w-[200px] px-4 py-3.5">推薦品項</th>
              <th scope="col" class="min-w-[170px] px-4 py-3.5">價位 / 備註</th>
              <th scope="col" class="w-28 px-4 py-3.5 text-center">地圖</th>
              <th id="th-visited" scope="col" class="w-28 px-3 py-3.5 text-center">造訪 / 心得</th>
              <th id="th-actions" scope="col" class="w-28 px-4 py-3.5 text-right">操作</th>
            </tr>
          </thead>
          <tbody id="food-table-body" class="divide-y divide-slate-100 bg-white"></tbody>
        </table>
      </div>
      <div id="food-mobile-list" class="space-y-3 p-3 md:hidden"></div>
      <div id="food-image-grid" class="hidden grid grid-cols-2 gap-3 p-3 sm:grid-cols-3 lg:grid-cols-4 sm:p-4"></div>
      <div id="empty-state" class="hidden p-12 text-center">
        <h3 class="text-base font-semibold text-slate-800">目前沒有符合條件的餐廳</h3>
        <p class="mt-1 text-sm text-slate-500">試著重設篩選條件，或點擊右上角「新增美食 / 貼上 JSON」建立第一筆收藏。</p>
      </div>
    </section>
  </main>

  <!-- Add / Edit Spot Modal -->
  <div id="spot-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/60 p-4 backdrop-blur-sm" role="dialog" aria-modal="true" aria-labelledby="spot-modal-title">
    <div class="relative max-h-[92vh] w-full max-w-2xl overflow-y-auto rounded-2xl bg-white p-6 shadow-2xl">
      <div class="mb-4 flex items-center justify-between border-b border-slate-100 pb-3">
        <h2 id="spot-modal-title" class="text-lg font-bold text-slate-900">新增美食餐廳</h2>
        <button id="btn-close-spot" type="button" aria-label="關閉視窗" class="inline-flex h-8 w-8 items-center justify-center rounded-full text-slate-400 hover:bg-slate-100 hover:text-slate-700">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <form id="spot-form" class="space-y-4">
        <input type="hidden" id="field-id" />

        <!-- Quick JSON Paste -->
        <div class="rounded-xl border border-amber-200 bg-amber-50/60 p-3.5">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <label for="field-json-paste" class="text-sm font-semibold text-amber-950">貼上 Gemini JSON 快速填入（支援單筆或一次多筆陣列）</label>
            <div class="flex gap-2">
              <button id="btn-paste-json" type="button" class="rounded-lg border border-amber-300 bg-white px-2.5 py-1 text-xs font-medium text-amber-800 hover:bg-amber-100">從剪貼簿貼上並套用</button>
              <button id="btn-apply-json" type="button" class="rounded-lg bg-amber-600 px-3 py-1 text-xs font-semibold text-white hover:bg-amber-700">套用 JSON</button>
            </div>
          </div>
          <textarea id="field-json-paste" rows="3" placeholder="貼上 Gemini 產生的餐廳 JSON（若一次貼入 [...] 多筆陣列，會直接為您批次新增進清單！）" class="mt-2 w-full rounded-xl border border-amber-200 bg-white px-3 py-2 font-mono text-xs outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-100"></textarea>
        </div>

        <!-- Food Thumbnail Upload -->
        <div>
          <label class="mb-1.5 block text-sm font-medium text-slate-700">食物縮圖（上傳照片或貼上圖片網址）</label>
          <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
            <div class="h-20 w-24 shrink-0 overflow-hidden rounded-xl border border-slate-200 bg-slate-50 flex items-center justify-center">
              <img id="field-image-preview" src="" alt="食物縮圖" class="hidden h-full w-full object-cover" />
              <span id="field-image-placeholder" class="text-[11px] text-slate-400">尚無照片</span>
            </div>
            <div class="flex flex-1 flex-col gap-2">
              <label for="field-image-file" class="inline-flex w-fit cursor-pointer items-center gap-1.5 rounded-xl border border-amber-200 bg-amber-50 px-3 py-1.5 text-xs font-semibold text-amber-800 hover:bg-amber-100">
                上傳食物照片
              </label>
              <input id="field-image-file" type="file" accept="image/*" class="hidden" />
              <input id="field-image-url" type="text" placeholder="或貼上圖片網址 (https://...)" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-100" />
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
          <div>
            <label for="field-name" class="mb-1 block text-sm font-medium text-slate-700">店名 *</label>
            <input id="field-name" type="text" required placeholder="例：麵屋武蔵 新宿總本店" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-100" />
          </div>
          <div>
            <label for="field-jp-name" class="mb-1 block text-sm font-medium text-slate-700">日文 / 原文店名</label>
            <input id="field-jp-name" type="text" placeholder="例：麺屋武蔵 新宿総本店" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-100" />
          </div>
        </div>

        <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
          <div>
            <label for="field-region" class="mb-1 block text-sm font-medium text-slate-700">大地區</label>
            <input id="field-region" type="text" list="region-suggestions" placeholder="例：關東 / 關西" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-100" />
            <datalist id="region-suggestions">
              <option value="關東"></option>
              <option value="關西"></option>
              <option value="九州"></option>
              <option value="北陸甲信越"></option>
              <option value="北海道"></option>
              <option value="東北"></option>
              <option value="中部"></option>
              <option value="四國"></option>
              <option value="沖繩"></option>
              <option value="台灣"></option>
            </datalist>
          </div>
          <div>
            <label for="field-city" class="mb-1 block text-sm font-medium text-slate-700">城市</label>
            <input id="field-city" type="text" list="city-suggestions" placeholder="例：東京 / 新潟 / 福岡" class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-100" />
            <datalist id="city-suggestions">
              <option value="東京"></option>
              <option value="橫濱"></option>
              <option value="鎌倉"></option>

    ↑ 頂端
  </button>
  <script>
    (function () {
      const btn = document.getElementById('btn-scroll-top');
      if (!btn) return;
      const getScrollTop = () => Math.max(window.scrollY || 0, document.documentElement.scrollTop || 0, document.body.scrollTop || 0);
      const toggle = () => {
        if (getScrollTop() > 120) { btn.classList.remove('hidden'); btn.classList.add('inline-flex'); }
        else { btn.classList.add('hidden'); btn.classList.remove('inline-flex'); }
      };
      window.addEventListener('scroll', toggle, { passive: true });
      document.addEventListener('scroll', toggle, { passive: true });
      toggle();
      btn.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
        document.documentElement.scrollTo({ top: 0, behavior: 'smooth' });
        document.body.scrollTo({ top: 0, behavior: 'smooth' });
      });
    })();
  </script>

  <!-- Toast -->
  <div id="toast" class="pointer-events-none fixed bottom-6 left-1/2 z-50 -translate-x-1/2 translate-y-4 rounded-xl bg-slate-900 px-4 py-2.5 text-sm font-medium text-white opacity-0 shadow-lg transition-all duration-300"></div>

  <script>
    const SUPABASE_URL = 'https://euphgazenhnurptrjazi.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_2hiYcmj_Aug9AH0VaY9M9w_vIUlzmBg';
    const STORAGE_BUCKET = 'shopping-products';
    const LOCAL_FOOD_KEY = 'food_map_spots_v1';
    const BASE_FOOD_TYPES = ['拉麵', '居酒屋', '甜點', '咖啡廳', '燒肉', '壽司', '定食', '烏龍麵/蕎麥麵', '酒吧', '麵包烘焙', '其他'];

    let supabaseClient = null;
    let currentUser = null;
    let shareToken = null;
    let isShareMode = false;
    let isViewMode = localStorage.getItem('ehon_view_mode') === '1';
    let sharedTrip = null;
    let spots = [];
    let quickFilterMode = 'type'; // 'type' | 'location'
    let foodDisplayMode = localStorage.getItem('ehon_food_display_mode') === 'detail' ? 'detail' : 'image';
    let filters = {
      region: '全部',
      city: '全部',
      area: '全部',
      foodType: '全部',
      onlyStarred: false,
      visited: 'all',
      search: ''
    };

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('opacity-0', 'translate-y-4');
      el.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.classList.add('opacity-0', 'translate-y-4');
        el.classList.remove('opacity-100', 'translate-y-0');
      }, 2800);
    }

    function updateSyncBadge(text) {
      const btn = document.getElementById('btn-cloud-sync');
      const label = document.getElementById('btn-cloud-label');
      const state = document.getElementById('cloud-auth-state');
      const loginBtn = document.getElementById('btn-cloud-login');
      const logoutBtn = document.getElementById('btn-cloud-logout');
      const emailField = document.getElementById('cloud-email-field');
      if (btn) {
        if (text) {
          if (label) label.textContent = text;
          btn.title = text;
          btn.className = 'ehon-btn inline-flex h-9 items-center justify-center gap-1.5 rounded-2xl bg-[#F6D27A] px-2.5 text-xs font-bold text-[#3E3A39] hover:brightness-95 sm:h-auto sm:px-3 sm:py-2 sm:text-sm';
        } else if (currentUser) {
          if (label) label.textContent = '雲端已連線';
          btn.title = '雲端已連線';
          btn.className = 'ehon-btn inline-flex h-9 items-center justify-center gap-1.5 rounded-2xl bg-[#B9DAA5] px-2.5 text-xs font-bold text-[#3E3A39] hover:brightness-95 sm:h-auto sm:px-3 sm:py-2 sm:text-sm';
        } else {
          if (label) label.textContent = '雲端同步（本機）';
          btn.title = '雲端同步（本機）';
          btn.className = 'ehon-btn inline-flex h-9 items-center justify-center gap-1.5 rounded-2xl bg-[#A8D3E6] px-2.5 text-xs font-bold text-[#3E3A39] hover:brightness-95 sm:h-auto sm:px-3 sm:py-2 sm:text-sm';
        }
      }
      if (state) state.textContent = currentUser ? `已登入：${currentUser.email || '帳號'}。美食清單已同步至雲端。` : '尚未登入。輸入電子郵件即可收到安全登入連結。';
      if (loginBtn) loginBtn.classList.toggle('hidden', !!currentUser);
      if (logoutBtn) logoutBtn.classList.toggle('hidden', !currentUser);
      if (emailField) emailField.classList.toggle('hidden', !!currentUser);
    }

    function loadLocalSpots() {
      try {
        const raw = localStorage.getItem(LOCAL_FOOD_KEY);
        const parsed = raw ? JSON.parse(raw) : null;
        if (Array.isArray(parsed)) return parsed;
      } catch (e) {}
      return [];
    }

    function loadShareStarState() {
      if (!shareToken) return {};
      try {
        return JSON.parse(localStorage.getItem(`ehon_share_food_stars_${shareToken}`) || '{}');
      } catch (e) {
        return {};
      }
    }

    function saveShareStarState(map) {
      if (!shareToken) return;
      try {
        localStorage.setItem(`ehon_share_food_stars_${shareToken}`, JSON.stringify(map));
      } catch (e) {}
    }

    function saveLocalSpots() {
      if (isShareMode) return;
      try { localStorage.setItem(LOCAL_FOOD_KEY, JSON.stringify(spots)); } catch (e) {}
    }

    function buildMapsUrl(spot) {
      const url = String(spot.google_maps_url || '').trim();
      if (url && (url.includes('maps.app.goo.gl') || url.includes('/maps/place/'))) {
        return url;
      }
      const query = [spot.jp_name || spot.name, spot.area, spot.city].filter(Boolean).join(' ');
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
    }

    async function loadSharedFood(token) {
      if (!token) return;
      try {
        let payload = null;
        try {
          const res = await fetch(`${SUPABASE_URL}/functions/v1/get-shared-food`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'apikey': SUPABASE_ANON_KEY,
              'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            },
            body: JSON.stringify({ token }),
          });
          if (res.ok) {
            payload = await res.json();
          } else if (res.status === 404 || res.status === 400) {
            const errBody = await res.json().catch(() => ({}));
            throw new Error(errBody.error || '找不到此分享連結或連結已失效');
          }
        } catch (edgeErr) {
          if (edgeErr?.message?.includes('找不到此分享連結') || edgeErr?.message?.includes('無效的分享連結')) {
            throw edgeErr;
          }
          if (supabaseClient) {
            const { data, error } = await supabaseClient.rpc('get_shared_food', { p_token: token });
            if (error) throw error;
            if (!data || !data.trip) throw new Error('找不到此分享連結或連結已失效');
            payload = data;
          } else {
            throw edgeErr;
          }
        }

        sharedTrip = payload?.trip || null;
        const shareStarMap = loadShareStarState();
        const rows = Array.isArray(payload?.spots) ? payload.spots : [];
        spots = rows.map(s => ({
          ...s,
          starred: Object.prototype.hasOwnProperty.call(shareStarMap, s.id) ? Boolean(shareStarMap[s.id]) : Boolean(s.starred),
          image: s.image || s.image_url || '',
        }));

        renderAll();
      } catch (err) {
        console.error(err);
        spots = [];
        renderAll();
        showToast(err?.message || '載入分享美食地圖失敗');
      }
    }

    async function initSupabase() {
      if (!window.supabase?.createClient) return;
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
      });
      if (isShareMode) {
        await loadSharedFood(shareToken);
        return;
      }
      supabaseClient.auth.onAuthStateChange((event, session) => {
        currentUser = session?.user || null;
        updateSyncBadge();
        if (currentUser && event !== 'INITIAL_SESSION') {
          setTimeout(() => syncFromCloud(), 0);
        } else if (!currentUser && event !== 'INITIAL_SESSION') {
          spots = loadLocalSpots();
          renderAll();
        }
      });
      const { data } = await supabaseClient.auth.getSession();
      currentUser = data?.session?.user || null;
      updateSyncBadge();
      if (currentUser) await syncFromCloud();
    }

    async function syncFromCloud() {
      if (!supabaseClient || !currentUser) return;
      updateSyncBadge('同步中...');
      try {
        const { data, error } = await supabaseClient
          .from('food_spots')
          .select('*')
          .order('created_at', { ascending: false });
        if (error) throw error;
        const rows = data || [];
        const paths = Array.from(new Set(rows.map(s => s.image_path).filter(Boolean)));
        const signedMap = new Map();
        if (paths.length) {
          const { data: signedList } = await supabaseClient.storage.from(STORAGE_BUCKET).createSignedUrls(paths, 3600);
          if (Array.isArray(signedList)) {
            for (const entry of signedList) {
              if (entry.path && entry.signedUrl) signedMap.set(entry.path, entry.signedUrl);
            }
          }
        }
        for (const s of rows) {
          s.image = (s.image_path && signedMap.get(s.image_path)) || s.image_url || '';
        }
        spots = rows;
        saveLocalSpots();
        renderAll();
        updateSyncBadge();
      } catch (err) {
        console.error(err);
        updateSyncBadge();
        showToast(`雲端同步失敗：${err.message || ''}`);
      }
    }

    async function saveSpotToCloud(spot) {
      if (!supabaseClient || !currentUser) return spot;
      const id = spot.id && /^[0-9a-f-]{36}$/i.test(spot.id) ? spot.id : crypto.randomUUID();
      let imagePath = spot.image_path || null;
      let imageUrl = spot.image_url || null;
      let displayImage = spot.image || spot.image_url || '';

      if (typeof spot.image === 'string' && spot.image.startsWith('data:image/')) {
        const res = await fetch(spot.image);
        const blob = await res.blob();
        const ext = blob.type.includes('png') ? 'png' : 'jpg';
        imagePath = `${currentUser.id}/food/${id}/original.${ext}`;
        const { error: upErr } = await supabaseClient.storage.from(STORAGE_BUCKET).upload(imagePath, blob, {
          upsert: true, contentType: blob.type || 'image/jpeg'
        });
        if (upErr) throw upErr;
        imageUrl = null;
      } else if (typeof spot.image === 'string' && /^https?:\/\//i.test(spot.image) && !spot.image.includes('/storage/v1/object/sign/')) {
        imageUrl = spot.image;
        imagePath = null;
      } else if (!spot.image) {
        imageUrl = null;
        imagePath = null;
      }

      const row = {
        id,
        user_id: currentUser.id,
        name: spot.name,
        jp_name: spot.jp_name || null,
        region: spot.region || null,
        city: spot.city || null,
        area: spot.area || null,
        food_type: spot.food_type || '其他',
        recommended_items: spot.recommended_items || null,
        google_maps_url: spot.google_maps_url || null,
        rating: spot.rating != null && spot.rating !== '' ? Number(spot.rating) : null,
        price_range: spot.price_range || null,
        notes: spot.notes || null,
        image_path: imagePath,
        image_url: imageUrl,
        visited: Boolean(spot.visited),
        visit_review: spot.visit_review || null,
        starred: Boolean(spot.starred),
        updated_at: new Date().toISOString()
      };
      const { data, error } = await supabaseClient.from('food_spots').upsert(row).select().single();
      if (error) throw error;
      if (data.image_path) {
        const { data: signed } = await supabaseClient.storage.from(STORAGE_BUCKET).createSignedUrl(data.image_path, 3600);
        data.image = signed?.signedUrl || displayImage;
      } else {
        data.image = data.image_url || '';
      }
      return data;
    }

    function getFilteredSpots() {
      const q = filters.search.trim().toLowerCase();
      return spots.filter(s => {
        if (filters.region !== '全部' && (s.region || '') !== filters.region) return false;
        if (filters.city !== '全部' && (s.city || '') !== filters.city) return false;
        if (filters.area !== '全部' && (s.area || '') !== filters.area) return false;
        if (filters.foodType !== '全部' && (s.food_type || '其他') !== filters.foodType) return false;
        if (filters.onlyStarred && !s.starred) return false;
        if (filters.visited === 'visited' && !s.visited) return false;
        if (filters.visited === 'unvisited' && s.visited) return false;
        if (filters.visited.startsWith('review:')) {
          const targetReview = filters.visited.slice('review:'.length);
          if ((s.visit_review || '') !== targetReview) return false;
        }
        if (q) {
          const hay = [s.name, s.jp_name, s.region, s.city, s.area, s.food_type, s.recommended_items, s.notes].join(' ').toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

    function renderStats() {
      const totalEl = document.getElementById('stat-total');
      const starredEl = document.getElementById('stat-starred');
      if (totalEl) totalEl.textContent = spots.length;
      if (starredEl) starredEl.textContent = spots.filter(s => s.starred).length;
    }

    function renderFilters() {
      const regions = Array.from(new Set(spots.map(s => (s.region || '').trim()).filter(Boolean))).sort();
      const regionSel = document.getElementById('filter-region');
      if (filters.region !== '全部' && !regions.includes(filters.region)) filters.region = '全部';
      regionSel.innerHTML = `<option value="全部">全部大地區</option>` + regions.map(r => `<option value="${escapeHtml(r)}">${escapeHtml(r)}</option>`).join('');
      regionSel.value = filters.region;

      const citySource = filters.region === '全部' ? spots : spots.filter(s => s.region === filters.region);
      const cities = Array.from(new Set(citySource.map(s => (s.city || '').trim()).filter(Boolean))).sort();
      const citySel = document.getElementById('filter-city');
      if (filters.city !== '全部' && !cities.includes(filters.city)) filters.city = '全部';
      citySel.innerHTML = `<option value="全部">全部城市</option>` + cities.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
      citySel.value = filters.city;

      const areaSource = filters.city === '全部' ? citySource : citySource.filter(s => s.city === filters.city);
      const areas = Array.from(new Set(areaSource.map(s => (s.area || '').trim()).filter(Boolean))).sort();
      const areaSel = document.getElementById('filter-area');
      if (filters.area !== '全部' && !areas.includes(filters.area)) filters.area = '全部';
      areaSel.innerHTML = `<option value="全部">全部區域</option>` + areas.map(a => `<option value="${escapeHtml(a)}">${escapeHtml(a)}</option>`).join('');
      areaSel.value = filters.area;

      const extraTypes = spots.map(s => s.food_type).filter(t => t && !BASE_FOOD_TYPES.includes(t));
      const types = [...BASE_FOOD_TYPES, ...Array.from(new Set(extraTypes))];
      const pillsEl = document.getElementById('food-type-pills');
      pillsEl.innerHTML = types.map(t => {
        const active = filters.foodType === t;
        return `<button type="button" data-food-type="${escapeHtml(t)}" class="ehon-btn shrink-0 rounded-2xl px-3 py-1.5 text-xs font-bold sm:px-3.5 sm:py-2 ${
          active ? 'bg-[#A8D3E6] text-[#3E3A39]' : 'bg-[#FFFCF6] text-[#3E3A39] hover:bg-[#A8D3E6]/35'
        }">${escapeHtml(t)}</button>`;
      }).join('');

      // Location Quick Pills: Cities (prioritize 機場 & 東京) -> Optional Areas
      const allCitiesRaw = Array.from(new Set(spots.map(s => (s.city || '').trim()).filter(Boolean)));
      const cityPriority = name => {
        if (name.includes('機場')) return 0;
        if (name.includes('東京')) return 1;
        return 2;
      };
      const sortedCities = allCitiesRaw.sort((a, b) => {
        const pa = cityPriority(a);
        const pb = cityPriority(b);
        if (pa !== pb) return pa - pb;
        return a.localeCompare(b, 'zh-Hant');
      });

      const cityPillsEl = document.getElementById('food-city-pills');
      if (cityPillsEl) {
        const cityList = ['全部', ...sortedCities];
        cityPillsEl.innerHTML = cityList.map(c => {
          const active = filters.city === c;
          const count = c === '全部' ? spots.length : spots.filter(s => (s.city || '').trim() === c).length;
          const icon = c === '全部' ? '' : (c.includes('機場') ? '✈️ ' : (c.includes('東京') ? '🗼 ' : '📍 '));
          const label = c === '全部' ? `全部城市 (${count})` : `${icon}${c} (${count})`;
          return `<button type="button" data-city-pill="${escapeHtml(c)}" class="ehon-btn shrink-0 rounded-2xl px-3 py-1.5 text-xs font-bold sm:px-3.5 sm:py-2 ${
            active ? 'bg-[#A8D3E6] text-[#3E3A39]' : 'bg-[#FFFCF6] text-[#3E3A39] hover:bg-[#A8D3E6]/35'
          }">${escapeHtml(label)}</button>`;
        }).join('');
      }

      const areaPillsEl = document.getElementById('food-area-pills');
      if (areaPillsEl) {
        if (filters.city !== '全部') {
          const cityAreas = Array.from(new Set(
            spots.filter(s => (s.city || '').trim() === filters.city).map(s => (s.area || '').trim()).filter(Boolean)
          )).sort((a, b) => a.localeCompare(b, 'zh-Hant'));
          if (cityAreas.length > 0) {
            areaPillsEl.classList.remove('hidden');
            areaPillsEl.classList.add('flex');
            areaPillsEl.innerHTML = ['全部', ...cityAreas].map(a => {
              const active = filters.area === a;
              const label = a === '全部' ? '全部區域' : a;
              return `<button type="button" data-area-pill="${escapeHtml(a)}" class="shrink-0 rounded-full border-2 border-[#3E3A39] px-2.5 py-0.5 text-[11px] font-bold transition ${
                active ? 'bg-[#F6D27A] text-[#3E3A39]' : 'bg-white text-[#3E3A39]/80 hover:bg-[#F6D27A]/35'
              }">${escapeHtml(label)}</button>`;
            }).join('');
          } else {
            areaPillsEl.classList.add('hidden');
            areaPillsEl.classList.remove('flex');
            areaPillsEl.innerHTML = '';
          }
        } else {
          areaPillsEl.classList.add('hidden');
          areaPillsEl.classList.remove('flex');
          areaPillsEl.innerHTML = '';
        }
      }

      // Switch visibility between Type & Location pills
      const btnModeType = document.getElementById('btn-mode-type');
      const btnModeLoc = document.getElementById('btn-mode-location');
      const locWrap = document.getElementById('food-location-pills-wrap');
      if (btnModeType && btnModeLoc && locWrap) {
        const isLoc = quickFilterMode === 'location';
        pillsEl.classList.toggle('hidden', isLoc);
        locWrap.classList.toggle('hidden', !isLoc);
        btnModeType.className = `rounded-xl px-2.5 py-1 transition ${!isLoc ? 'bg-[#A8D3E6] text-[#3E3A39]' : 'text-[#3E3A39]/75 hover:bg-[#A8D3E6]/30'}`;
        btnModeLoc.className = `rounded-xl px-2.5 py-1 transition ${isLoc ? 'bg-[#A8D3E6] text-[#3E3A39]' : 'text-[#3E3A39]/75 hover:bg-[#F6D27A]/30'}`;
        btnModeType.setAttribute('aria-selected', String(!isLoc));
        btnModeLoc.setAttribute('aria-selected', String(isLoc));
      }

      const summaryEl = document.getElementById('active-filter-summary');
      if (summaryEl) {
        const chips = [];
        if (filters.foodType !== '全部') chips.push(`<span class="rounded-full border border-[#3E3A39]/30 bg-[#A8D3E6]/35 px-2 py-0.5">🍜 ${escapeHtml(filters.foodType)}</span>`);
        if (filters.city !== '全部') {
          const locTxt = filters.area !== '全部' ? `${filters.city}・${filters.area}` : filters.city;
          chips.push(`<span class="rounded-full border border-[#3E3A39]/30 bg-[#F6D27A]/45 px-2 py-0.5">📍 ${escapeHtml(locTxt)}</span>`);
        }
        summaryEl.innerHTML = chips.join('');
      }

      const starBtn = document.getElementById('btn-filter-star');
      if (starBtn) {
        starBtn.className = `ehon-btn inline-flex shrink-0 items-center gap-1.5 rounded-2xl px-3 py-1.5 text-left sm:px-3.5 sm:py-2 ${
          filters.onlyStarred ? 'bg-[#F6D27A]' : 'bg-[#FFFCF6] hover:bg-[#F6D27A]/45'
        }`;
      }
      const allBtn = document.getElementById('btn-filter-all');
      if (allBtn) {
        const isAllActive = !filters.onlyStarred && filters.foodType === '全部' && filters.city === '全部' && filters.area === '全部' && filters.region === '全部';
        allBtn.className = `ehon-btn inline-flex shrink-0 items-center gap-1.5 rounded-2xl px-3 py-1.5 text-left sm:px-3.5 sm:py-2 ${
          isAllActive ? 'bg-[#B9DAA5]' : 'bg-[#FFFCF6] hover:bg-[#B9DAA5]/35'
        }`;
      }
      const advDot = document.getElementById('food-advanced-dot');
      if (advDot) {
        const hasAdv = filters.region !== '全部' || filters.visited !== 'all' || Boolean(filters.search.trim());
        advDot.classList.toggle('hidden', !hasAdv);
      }
      const quickResetBtn = document.getElementById('btn-quick-reset');
      if (quickResetBtn) {
        const hasAnyFilter = filters.onlyStarred || filters.foodType !== '全部' || filters.city !== '全部' || filters.area !== '全部' || filters.region !== '全部' || filters.visited !== 'all' || Boolean(filters.search.trim());
        quickResetBtn.classList.toggle('hidden', !hasAnyFilter);
      }
    }

    const REVIEW_META = {
      '很好': { label: '😋 很好', cls: 'bg-[#B9DAA5] text-[#3E3A39]' },
      '普通': { label: '😐 普通', cls: 'bg-[#F6D27A] text-[#3E3A39]' },
      '踩雷': { label: '💣 踩雷', cls: 'bg-[#F2A497] text-[#3E3A39]' },
    };

    function renderReviewControl(s) {
      if (isShareMode) return '';
      const review = s.visit_review || '';
      const meta = REVIEW_META[review];
      const colorCls = meta ? meta.cls : 'bg-slate-50 text-slate-500';
      return `
        <select data-action="change-review" data-id="${escapeHtml(s.id)}" aria-label="去過心得" class="rounded-full border border-slate-200 px-2 py-0.5 text-[11px] font-medium outline-none cursor-pointer ${colorCls}">
          <option value="" ${review === '' ? 'selected' : ''}>心得：—</option>
          <option value="很好" ${review === '很好' ? 'selected' : ''}>😋 很好</option>
          <option value="普通" ${review === '普通' ? 'selected' : ''}>😐 普通</option>

        label.textContent = isImg ? '詳細模式' : '圖片模式';
        btn.className = `ehon-btn inline-flex shrink-0 items-center gap-1 rounded-2xl px-2.5 py-1.5 text-xs font-bold text-[#3E3A39] sm:px-3 sm:py-2 ${

      const desktopWrap = document.getElementById('food-desktop-table-wrap');
      const mobileList = document.getElementById('food-mobile-list');
      const imageGrid = document.getElementById('food-image-grid');
      const isImg = foodDisplayMode === 'image';
      if (desktopWrap) {
        desktopWrap.classList.toggle('md:block', !isImg);
        desktopWrap.classList.add('hidden');

      if (mobileList) {
        mobileList.classList.toggle('md:hidden', !isImg);
        mobileList.classList.toggle('hidden', isImg);

      if (imageGrid) {

                  <div class="mt-1 flex flex-wrap gap-1 text-[10px] font-bold">
                    ${s.city ? `<span class="rounded border border-[#3E3A39] bg-[#A8D3E6] px-1.5 py-0.5">${escapeHtml(s.city)}</span>` : ''}
                    ${s.area ? `<span class="rounded border border-[#3E3A39] bg-[#F6D27A] px-1.5 py-0.5">${escapeHtml(s.area)}</span>` : ''}
                  </div>
                </div>
                <a href="${escapeHtml(mapsUrl)}" target="_blank" rel="noopener noreferrer" class="ehon-btn inline-flex w-full items-center justify-center gap-1 rounded-xl bg-[#A8D3E6] px-2 py-1.5 text-xs font-bold text-[#3E3A39] hover:brightness-95">📍 開啟地圖</a>
              </div>
            </article>

      if (mobileList) {

          return `
            <div class="rounded-2xl border-[2.5px] border-[#3E3A39] bg-[#FFFCF6] p-3.5 shadow-[0_3px_0_#3E3A39]">
              <div class="flex items-start gap-3">
                ${s.image
                  ? `<button type="button" data-action="zoom-photo" data-id="${escapeHtml(s.id)}" class="h-24 w-24 shrink-0 overflow-hidden rounded-xl border-2 border-[#3E3A39] bg-slate-100"><img src="${escapeHtml(s.image)}" alt="${escapeHtml(s.name)}" class="h-full w-full object-cover" /></button>`

                      <svg class="h-6 w-6" viewBox="0 0 24 24" fill="${s.starred ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.8">

                    ${s.region ? `<span class="rounded-lg border border-[#3E3A39] bg-white px-1.5 py-0.5">${escapeHtml(s.region)}</span>` : ''}

            <td class="px-3 py-3.5 text-center">
              <div class="flex flex-col items-center gap-1.5">
                <button type="button" data-action="toggle-visited" data-id="${escapeHtml(s.id)}" class="rounded-full px-2.5 py-1 text-xs font-medium transition ${
                    s.visited ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'
                  }">${s.visited ? '已吃過' : '未去過'}</button>
                ${renderReviewControl(s)}
              </div>
            </td>`}
            ${(isShareMode || isViewMode) ? '' : `
            <td class="px-4 py-3.5 text-right text-xs">
              <button type="button" data-action="edit" data-id="${escapeHtml(s.id)}" class="mr-2 font-medium text-slate-600 hover:text-slate-900">編輯</button>
              <button type="button" data-action="delete" data-id="${escapeHtml(s.id)}" class="font-medium text-rose-600 hover:text-rose-800">刪除</button>
            </td>`}
          </tr>
        `;
      }).join('');
    }

    function renderAll() {
      const toggleBtn = document.getElementById('btn-toggle-view-mode');
      const toggleIcon = document.getElementById('btn-view-mode-icon');
      const toggleLabel = document.getElementById('btn-view-mode-label');
      if (!isShareMode) {
        if (toggleBtn) {
          toggleBtn.classList.remove('hidden');
          if (toggleIcon) toggleIcon.textContent = isViewMode ? '✏️' : '👁️';
          if (toggleLabel) toggleLabel.textContent = isViewMode ? '切換編輯模式' : '切換檢視模式';
          toggleBtn.title = isViewMode ? '切換編輯模式' : '切換檢視模式';
          toggleBtn.className = `ehon-btn inline-flex h-9 items-center justify-center gap-1.5 rounded-2xl ${isViewMode ? 'bg-[#F6D27A]' : 'bg-[#FFFCF6] hover:bg-[#F6D27A]/40'} px-2.5 text-xs font-bold text-[#3E3A39] sm:h-auto sm:px-3 sm:py-2 sm:text-sm`;
        }
        document.getElementById('btn-add-spot')?.classList.toggle('hidden', isViewMode);
        document.getElementById('btn-add-spot')?.classList.toggle('inline-flex', !isViewMode);
        document.getElementById('th-actions')?.classList.toggle('hidden', isViewMode);
      }
      renderStats();
      renderFilters();
      renderTable();
    }

    function setFormPreview(url) {
      const img = document.getElementById('field-image-preview');
      const ph = document.getElementById('field-image-placeholder');
      if (url) {
        img.src = url;
        img.classList.remove('hidden');
        ph.classList.add('hidden');
      } else {
        img.src = '';
        img.classList.add('hidden');
        ph.classList.remove('hidden');
      }
    }

    function openSpotModal(editId = null) {
      document.getElementById('spot-form').reset();
      document.getElementById('field-id').value = '';
      document.getElementById('field-json-paste').value = '';
      setFormPreview('');
      if (editId) {
        const s = spots.find(x => x.id === editId);
        if (!s) return;
        document.getElementById('spot-modal-title').textContent = '編輯美食餐廳';
        document.getElementById('field-id').value = s.id;
        document.getElementById('field-name').value = s.name || '';
        document.getElementById('field-jp-name').value = s.jp_name || '';
        document.getElementById('field-region').value = s.region || '';
        document.getElementById('field-city').value = s.city || '';
        document.getElementById('field-area').value = s.area || '';
        document.getElementById('field-food-type').value = s.food_type || '';
        document.getElementById('field-price-range').value = s.price_range || '';
        document.getElementById('field-rating').value = s.rating ?? '';
        document.getElementById('field-recommended-items').value = s.recommended_items || '';
        document.getElementById('field-visit-review').value = s.visit_review || '';
        document.getElementById('field-google-maps-url').value = s.google_maps_url || '';
        document.getElementById('field-notes').value = s.notes || '';
        document.getElementById('field-image-url').value = s.image || '';
        setFormPreview(s.image || '');
      } else {
        document.getElementById('spot-modal-title').textContent = '新增美食餐廳';
      }
      const m = document.getElementById('spot-modal');
      m.classList.remove('hidden');
      m.classList.add('flex');
    }

    function closeSpotModal() {
      const m = document.getElementById('spot-modal');
      m.classList.add('hidden');
      m.classList.remove('flex');
    }

    function parseJsonText(raw) {
      const t = String(raw || '').trim().replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim();
      const arrStart = t.indexOf('[');
      const objStart = t.indexOf('{');
      let s = -1, e = -1;
      if (arrStart !== -1 && (objStart === -1 || arrStart < objStart)) {
        s = arrStart; e = t.lastIndexOf(']');
      } else if (objStart !== -1) {
        s = objStart; e = t.lastIndexOf('}');
      }
      return JSON.parse(s !== -1 && e > s ? t.slice(s, e + 1) : t);
    }

    async function applyJsonInput(raw) {
      let parsed;
      try { parsed = parseJsonText(raw); } catch (e) {
        showToast('JSON 格式有誤，請確認複製完整內容');
        return;
      }
      if (Array.isArray(parsed)) {
        let added = 0;
        for (const item of parsed) {
          if (!item || !item.name) continue;
          const spot = {
            id: crypto.randomUUID(),
            name: String(item.name),
            jp_name: item.jp_name || item.jpName || '',
            region: item.region || '',
            city: item.city || '',
            area: item.area || '',
            food_type: item.food_type || item.foodType || '其他',
            recommended_items: Array.isArray(item.recommended_items) ? item.recommended_items.join('、') : (item.recommended_items || item.recommendedItems || ''),
            google_maps_url: item.google_maps_url || item.googleMapsUrl || '',
            rating: item.rating ?? null,
            price_range: item.price_range || item.priceRange || '',
            notes: item.notes || '',
            visited: Boolean(item.visited),
            starred: Boolean(item.starred)
          };
          const saved = currentUser ? await saveSpotToCloud(spot) : spot;
          spots.unshift(saved);
          added++;
        }
        saveLocalSpots();
        renderAll();
        closeSpotModal();
        showToast(`已批次新增 ${added} 間餐廳！`);
        return;
      }
      const d = parsed || {};
      if (d.name) document.getElementById('field-name').value = d.name;
      if (d.jp_name || d.jpName) document.getElementById('field-jp-name').value = d.jp_name || d.jpName;
      if (d.region) document.getElementById('field-region').value = d.region;
      if (d.city) document.getElementById('field-city').value = d.city;
      if (d.area) document.getElementById('field-area').value = d.area;
      if (d.food_type || d.foodType) document.getElementById('field-food-type').value = d.food_type || d.foodType;
      if (d.price_range || d.priceRange) document.getElementById('field-price-range').value = d.price_range || d.priceRange;
      if (d.rating != null) document.getElementById('field-rating').value = d.rating;
      if (d.recommended_items || d.recommendedItems) {
        const rec = d.recommended_items || d.recommendedItems;
        document.getElementById('field-recommended-items').value = Array.isArray(rec) ? rec.join('、') : rec;
      }
      if (d.google_maps_url || d.googleMapsUrl) document.getElementById('field-google-maps-url').value = d.google_maps_url || d.googleMapsUrl;
      if (d.notes) document.getElementById('field-notes').value = d.notes;
      showToast('已成功填入 JSON，請確認後按「儲存餐廳」');
    }

    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      shareToken = params.get('share');
      isShareMode = Boolean(shareToken);

      if (isShareMode) {
        document.querySelectorAll('[data-hide-in-share="true"]').forEach(el => el.classList.add('hidden'));
        const tripLink = document.getElementById('nav-trip-link');
        const expLink = document.getElementById('nav-expenses-link');
        const jpLink = document.getElementById('nav-japanese-link');
        if (tripLink) tripLink.href = `./trip.html?share=${encodeURIComponent(shareToken)}`;
        if (expLink) expLink.href = `./expenses.html?share=${encodeURIComponent(shareToken)}`;
        if (jpLink) jpLink.href = `./japanese.html?share=${encodeURIComponent(shareToken)}`;
        document.getElementById('btn-toggle-view-mode')?.classList.add('hidden');
        document.getElementById('btn-cloud-sync')?.classList.add('hidden');
        document.getElementById('btn-add-spot')?.classList.add('hidden');
        document.getElementById('th-visited')?.classList.add('hidden');
        document.getElementById('th-actions')?.classList.add('hidden');
        document.getElementById('filter-visited')?.classList.add('hidden');
        const subtitle = document.getElementById('header-subtitle');
        if (subtitle) subtitle.textContent = '旅伴專用・可點擊 ★ 標記想吃的餐廳（儲存在您的瀏覽器），並開啟 Google Maps 導航';
        const visitedSelect = document.getElementById('filter-visited');
        if (visitedSelect) {
          Array.from(visitedSelect.options).forEach(opt => {
            if (opt.value.startsWith('review:')) opt.remove();
          });
        }
        spots = [];
      } else {
        spots = loadLocalSpots();
      }
      renderAll();
      initSupabase().catch(console.error);

      document.getElementById('btn-toggle-food-advanced')?.addEventListener('click', () => {
        const panel = document.getElementById('food-advanced-panel');
        const arrow = document.getElementById('food-advanced-arrow');
        const btn = document.getElementById('btn-toggle-food-advanced');
        if (!panel) return;
        const willOpen = panel.classList.contains('hidden');
        panel.classList.toggle('hidden', !willOpen);
        if (arrow) arrow.textContent = willOpen ? '▴' : '▾';
        if (btn) btn.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
      });

      document.getElementById('btn-toggle-view-mode')?.addEventListener('click', () => {
        if (isShareMode) return;
        isViewMode = !isViewMode;
        try { localStorage.setItem('ehon_view_mode', isViewMode ? '1' : '0'); } catch (e) {}
        renderAll();
        showToast(isViewMode ? '已切換為檢視模式（隱藏編輯與新增刪除）' : '已切換為編輯模式');
      });

      document.getElementById('filter-region').addEventListener('change', e => {
        filters.region = e.target.value;
        filters.city = '全部';
        filters.area = '全部';
        renderFilters();
        renderTable();
      });
      document.getElementById('filter-city').addEventListener('change', e => {
        filters.city = e.target.value;
        filters.area = '全部';
        renderFilters();
        renderTable();
      });
      document.getElementById('filter-area').addEventListener('change', e => {
        filters.area = e.target.value;
        renderTable();
      });
      document.getElementById('input-search').addEventListener('input', e => {
        filters.search = e.target.value;
        renderFilters();
        renderTable();
      });
      document.getElementById('input-search').addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          e.preventDefault();
          e.target.blur();
        }
      });
      document.getElementById('btn-mode-type')?.addEventListener('click', () => {
        quickFilterMode = 'type';
        renderFilters();
      });
      document.getElementById('btn-mode-location')?.addEventListener('click', () => {
        quickFilterMode = 'location';
        renderFilters();
      });
      document.getElementById('food-city-pills')?.addEventListener('click', e => {
        const btn = e.target.closest('[data-city-pill]');
        if (!btn) return;
        const clickedCity = btn.dataset.cityPill;
        filters.region = '全部';
        filters.city = filters.city === clickedCity ? '全部' : clickedCity;
        filters.area = '全部';
        renderFilters();
        renderTable();
      });
      document.getElementById('food-area-pills')?.addEventListener('click', e => {
        const btn = e.target.closest('[data-area-pill]');
        if (!btn) return;
        const clickedArea = btn.dataset.areaPill;
        filters.area = filters.area === clickedArea ? '全部' : clickedArea;
        renderFilters();
        renderTable();
      });
      document.getElementById('food-type-pills').addEventListener('click', e => {
        const btn = e.target.closest('[data-food-type]');
        if (!btn) return;
        filters.foodType = filters.foodType === btn.dataset.foodType ? '全部' : btn.dataset.foodType;
        renderFilters();
        renderTable();
      });
      document.getElementById('btn-filter-all')?.addEventListener('click', () => {
        filters.onlyStarred = false;
        filters.foodType = '全部';
        filters.region = '全部';
        filters.city = '全部';
        filters.area = '全部';
        renderFilters();
        renderTable();
      });
      document.getElementById('btn-filter-star').addEventListener('click', () => {
        filters.onlyStarred = !filters.onlyStarred;
        renderFilters();
        renderTable();
      });
      document.getElementById('filter-visited').addEventListener('change', e => {
        filters.visited = e.target.value;
        renderTable();
      });
      function resetAllFilters() {
        filters = { region: '全部', city: '全部', area: '全部', foodType: '全部', onlyStarred: false, visited: 'all', search: '' };
        document.getElementById('input-search').value = '';
        document.getElementById('filter-visited').value = 'all';
        renderAll();
      }
      document.getElementById('btn-reset-filters').addEventListener('click', resetAllFilters);
      document.getElementById('btn-quick-reset')?.addEventListener('click', resetAllFilters);

      async function handleSpotClick(e) {
        const btn = e.target.closest('[data-action]');
        if (!btn) return;
        const { action, id } = btn.dataset;
        const idx = spots.findIndex(x => x.id === id);
        if (idx === -1) return;

        if (action === 'zoom-photo') {
          if (!spots[idx].image) return;
          document.getElementById('lightbox-img').src = spots[idx].image;
          document.getElementById('lightbox-caption').textContent = spots[idx].name;
          const lb = document.getElementById('photo-lightbox');
          lb.classList.remove('hidden'); lb.classList.add('flex');
          return;
        }
        if (action === 'toggle-star') {
          spots[idx].starred = !spots[idx].starred;
          if (isShareMode) {
            const shareStarMap = loadShareStarState();
            shareStarMap[id] = spots[idx].starred;
            saveShareStarState(shareStarMap);
            renderStats();
            renderTable();
            return;
          }
          saveLocalSpots();
          renderStats();
          renderTable();
          if (currentUser && supabaseClient) {
            await supabaseClient.from('food_spots').update({ starred: spots[idx].starred }).eq('id', id);
          }
          return;
        }
        if (isShareMode) return;
        if (action === 'toggle-visited') {
          spots[idx].visited = !spots[idx].visited;
          saveLocalSpots();
          renderStats();
          renderTable();
          if (currentUser && supabaseClient) {
            await supabaseClient.from('food_spots').update({ visited: spots[idx].visited }).eq('id', id);
          }
          return;
        }
        if (isViewMode) return;
        if (action === 'edit') {
          openSpotModal(id);
        } else if (action === 'delete') {
          if (!confirm(`確定要刪除「${spots[idx].name}」嗎？`)) return;
          const imgPath = spots[idx].image_path;
          spots.splice(idx, 1);
          saveLocalSpots();
          renderAll();
          if (currentUser && supabaseClient) {
            if (imgPath) await supabaseClient.storage.from(STORAGE_BUCKET).remove([imgPath]);
            await supabaseClient.from('food_spots').delete().eq('id', id);
          }
          showToast('已刪除餐廳');
        }
      }

      async function handleReviewChange(e) {
        if (isShareMode) return;
        const sel = e.target.closest('[data-action="change-review"]');
        if (!sel) return;
        const id = sel.dataset.id;
        const idx = spots.findIndex(x => x.id === id);
        if (idx === -1) return;
        const review = sel.value || null;
        spots[idx].visit_review = review;
        if (review) spots[idx].visited = true;
        saveLocalSpots();
        renderStats();
        renderTable();
        if (currentUser && supabaseClient) {
          await supabaseClient.from('food_spots').update({
            visit_review: review,
            visited: spots[idx].visited
          }).eq('id', id);
        }
      }

      document.getElementById('btn-toggle-food-display-mode')?.addEventListener('click', () => {
        foodDisplayMode = foodDisplayMode === 'image' ? 'detail' : 'image';
        try { localStorage.setItem('ehon_food_display_mode', foodDisplayMode); } catch (e) {}
        renderTable();
      });
      document.getElementById('food-table-body').addEventListener('click', handleSpotClick);
      document.getElementById('food-mobile-list').addEventListener('click', handleSpotClick);
      document.getElementById('food-image-grid')?.addEventListener('click', handleSpotClick);
      document.getElementById('food-table-body').addEventListener('change', handleReviewChange);
      document.getElementById('food-mobile-list').addEventListener('change', handleReviewChange);

      document.getElementById('btn-close-lightbox').addEventListener('click', () => {
        const lb = document.getElementById('photo-lightbox');
        lb.classList.add('hidden'); lb.classList.remove('flex');
      });
      document.getElementById('photo-lightbox').addEventListener('click', e => {
        if (e.target.id === 'photo-lightbox') {
          e.currentTarget.classList.add('hidden');
          e.currentTarget.classList.remove('flex');
        }
      });

      document.getElementById('field-image-file').addEventListener('change', e => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
          const img = new Image();
          img.onload = () => {
            const maxDim = 900;
            let w = img.width, h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w >= h) { h = Math.round(h * maxDim / w); w = maxDim; }
              else { w = Math.round(w * maxDim / h); h = maxDim; }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            const compressed = canvas.toDataURL('image/jpeg', 0.82);
            document.getElementById('field-image-url').value = compressed;
            setFormPreview(compressed);
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
      document.getElementById('field-image-url').addEventListener('input', e => setFormPreview(e.target.value.trim()));

      document.getElementById('btn-add-spot').addEventListener('click', () => openSpotModal());
      document.getElementById('btn-close-spot').addEventListener('click', closeSpotModal);
      document.getElementById('btn-cancel-spot').addEventListener('click', closeSpotModal);
      document.getElementById('spot-modal').addEventListener('click', e => { if (e.target.id === 'spot-modal') closeSpotModal(); });

      document.getElementById('btn-apply-json').addEventListener('click', () => applyJsonInput(document.getElementById('field-json-paste').value));
      document.getElementById('btn-paste-json').addEventListener('click', async () => {
        try {
          const text = await navigator.clipboard.readText();
          document.getElementById('field-json-paste').value = text;
          await applyJsonInput(text);
        } catch {
          showToast('瀏覽器未授權讀取剪貼簿，請長按貼入下方文字框後點「套用 JSON」');
        }
      });

      document.getElementById('spot-form').addEventListener('submit', async e => {
        e.preventDefault();
        const id = document.getElementById('field-id').value;
        const existing = id ? spots.find(x => x.id === id) : null;
        const spot = {
          id: id || crypto.randomUUID(),
          name: document.getElementById('field-name').value.trim(),
          jp_name: document.getElementById('field-jp-name').value.trim(),
          region: document.getElementById('field-region').value.trim(),
          city: document.getElementById('field-city').value.trim(),
          area: document.getElementById('field-area').value.trim(),
          food_type: document.getElementById('field-food-type').value.trim() || '其他',
          price_range: document.getElementById('field-price-range').value.trim(),
          rating: document.getElementById('field-rating').value ? Number(document.getElementById('field-rating').value) : null,
          recommended_items: document.getElementById('field-recommended-items').value.trim(),
          google_maps_url: document.getElementById('field-google-maps-url').value.trim(),
          notes: document.getElementById('field-notes').value.trim(),
          image: document.getElementById('field-image-url').value.trim(),
          image_path: existing ? existing.image_path : null,
          image_url: existing ? existing.image_url : null,
          visited: document.getElementById('field-visit-review').value ? true : (existing ? existing.visited : false),
          visit_review: document.getElementById('field-visit-review').value || null,
          starred: existing ? existing.starred : false
        };
        try {
          const saved = currentUser ? await saveSpotToCloud(spot) : spot;
          if (existing) {
            const idx = spots.findIndex(x => x.id === id);
            if (idx !== -1) spots[idx] = saved;
          } else {
            spots.unshift(saved);
          }
          saveLocalSpots();
          renderAll();
          closeSpotModal();
          showToast('餐廳已儲存！');
        } catch (err) {
          showToast(`儲存失敗：${err.message || ''}`);
        }
      });

      // Cloud Modal
      document.getElementById('btn-cloud-sync').addEventListener('click', () => {
        const m = document.getElementById('cloud-modal');
        m.classList.remove('hidden'); m.classList.add('flex');
      });
      document.getElementById('btn-close-cloud').addEventListener('click', () => {
        const m = document.getElementById('cloud-modal');
        m.classList.add('hidden'); m.classList.remove('flex');
      });
      document.getElementById('btn-cloud-refresh').addEventListener('click', () => syncFromCloud());
      document.getElementById('btn-cloud-login').addEventListener('click', async () => {
        const email = document.getElementById('field-cloud-email').value.trim();
        if (!email) { showToast('請輸入電子郵件'); return; }
        const { error } = await supabaseClient.auth.signInWithOtp({
          email,
          options: { emailRedirectTo: `${window.location.origin}${window.location.pathname}` }
        });
        if (error) showToast(`寄送失敗：${error.message}`);
        else showToast('登入連結已寄出，請至信箱點擊連結！');
      });
      document.getElementById('btn-cloud-logout').addEventListener('click', async () => {
        await supabaseClient.auth.signOut();
        currentUser = null;
        spots = loadLocalSpots();
        updateSyncBadge();
        renderAll();
        showToast('已登出帳號');
      });
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
